<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Quran Term Tracer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d5a45">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Term Tracer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style id="lockStyle">
@font-face { font-family: "Amiri"; src: url(fonts/amiri-700-latin.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "Amiri Quran"; src: url(fonts/amiri-quran-arabic.woff2) format("woff2"); }
:root { --paper: #f2f4f1; --sheet: #ffffff; --ink: #16201b; --muted: #5a6760; --rule: #d7ddd9; --accent: #1d5a45; --accent-ink: #ffffff; --accent-soft: #dcebe3; --bad: #9b2c2c; }
@media (prefers-color-scheme: dark) { :root { --paper: #101513; --sheet: #17201c; --ink: #e5ebe7; --muted: #9aa9a1; --rule: #2a3631; --accent: #7cc3a4; --accent-ink: #0d1a14; --accent-soft: #1d3a2e; --bad: #e48a8a; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lock { width: min(380px, 100%); background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 26px 24px; display: grid; gap: 14px; }
.lock h1 { margin: 0; font: 700 26px/1.15 "Amiri", Georgia, serif; }
.lock .ar { font: 26px/1.2 "Amiri Quran", "Traditional Arabic", serif; color: var(--accent); }
.lock p { margin: 0; color: var(--muted); font-size: 14px; }
.lock input[type=password] { width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border: 1.5px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); }
.lock input[type=password]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.lock label.keep { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
.lock label.keep input { width: 16px; height: 16px; accent-color: var(--accent); }
.lock button { font: inherit; font-weight: 600; padding: 10px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.lock button[disabled] { opacity: .6; cursor: default; }
.lock .msg { min-height: 1.4em; font-size: 14px; color: var(--bad); }
.lock .msg.ok { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<form class="lock" id="lock" autocomplete="on">
  <div><h1>Quran Term Tracer</h1><div class="ar" lang="ar">تتبّع الألفاظ</div></div>
  <p>This tracer is private. Enter the password to open it.</p>
  <input type="text" name="username" value="quran-term-tracer" autocomplete="username" hidden>
  <input type="password" id="pw" autocomplete="current-password" aria-label="Password" placeholder="Password" required>
  <label class="keep"><input type="checkbox" id="keep"> Keep unlocked on this device</label>
  <button type="submit" id="go">Unlock</button>
  <div class="msg" id="msg" role="status"></div>
</form>
<script>
(function () {
  "use strict";
  // offline helper: lets the installed app open without internet (audio still needs a connection)
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(function () { /* the site still works without it */ });
  }
  var KEY_STORE = "qtt.unlockKey";
  var $ = function (id) { return document.getElementById(id); };
  function say(t, ok) { $("msg").textContent = t; $("msg").className = "msg" + (ok ? " ok" : ""); }
  function b64(u8) { var s = ""; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function getStored() { try { return localStorage.getItem(KEY_STORE); } catch (e) { return null; } }
  function setStored(v) { try { if (v) localStorage.setItem(KEY_STORE, v); else localStorage.removeItem(KEY_STORE); } catch (e) { /* storage blocked */ } }

  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    say("This browser is too old to open the tracer. Please update it."); $("go").disabled = true; return;
  }
  var payload = fetch("payload.bin", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error("load"); return r.arrayBuffer(); })
    .then(function (buf) {
      var u8 = new Uint8Array(buf);
      if (new TextDecoder().decode(u8.slice(0, 4)) !== "QTT1") throw new Error("format");
      return { salt: u8.slice(4, 20), iv: u8.slice(20, 32), iter: new DataView(buf).getUint32(32), data: u8.slice(36) };
    });

  function deriveKey(pw, p) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: p.salt, iterations: p.iter, hash: "SHA-256" }, base,
        { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }
  function openWith(key, p) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: p.iv }, key, p.data).then(function (gz) {
      var stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Response(stream).text();
    }).then(function (txt) { return JSON.parse(txt); });
  }
  function launch(bundle, key) {
    $("lockStyle").remove();
    var st = document.createElement("style"); st.textContent = bundle.css; document.head.appendChild(st);
    document.body.innerHTML = bundle.body;
    bundle.scripts.forEach(function (code) { var s = document.createElement("script"); s.textContent = code; document.body.appendChild(s); });
    // a Lock button beside the other header buttons
    var bar = document.querySelector(".top-actions");
    if (bar) {
      var b = document.createElement("button"); b.type = "button"; b.className = "icon-btn"; b.textContent = "Lock";
      b.title = "Lock the tracer and forget the password on this device";
      b.addEventListener("click", function () { setStored(null); location.reload(); });
      bar.appendChild(b);
    }
  }

  // already unlocked on this device?
  var stored = getStored();
  if (stored) {
    say("Opening…", true);
    payload.then(function (p) {
      return crypto.subtle.importKey("raw", unb64(stored), "AES-GCM", true, ["decrypt"]).then(function (key) {
        return openWith(key, p).then(function (bundle) { launch(bundle, key); });
      });
    }).catch(function () { setStored(null); say(""); $("pw").focus(); });
  } else $("pw").focus();

  $("lock").addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = $("pw").value; if (!pw) return;
    $("go").disabled = true; say("Unlocking…", true);
    payload.then(function (p) {
      return deriveKey(pw, p).then(function (key) {
        return openWith(key, p).then(function (bundle) {
          if ($("keep").checked) return crypto.subtle.exportKey("raw", key).then(function (raw) { setStored(b64(new Uint8Array(raw))); return bundle; });
          return bundle;
        }).then(function (bundle) { launch(bundle, key); });
      });
    }).catch(function (err) {
      $("go").disabled = false;
      if (err && err.message === "load") say("The site could not load. Check your internet connection and reload.");
      else if (err && err.message === "format") say("The site files are damaged. Please rebuild and publish again.");
      else { say("That password is not right. Try again."); $("pw").select(); }
    });
  });
})();
</script>
</body>
</html>
